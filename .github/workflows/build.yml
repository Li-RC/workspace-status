name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS build and self-tests
    runs-on: macos-26
    timeout-minutes: 15
    env:
      WORKSPACE_STATUS_SIGNING_IDENTITY: "-"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Build app and run self-tests
        run: bash build.sh
      - name: Verify app signature
        run: codesign --verify --deep --strict "dist/Workspace Status.app"
